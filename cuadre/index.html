<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuadre</title>
<meta name="description" content="Finanzas personales para República Dominicana: cuentas, movimientos, deudas, tarjetas, presupuesto y metas.">
<meta name="theme-color" content="#2448C8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuadre">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i></i>Cuadre</div>
    <span class="chip" id="topChip">—</span>
  </header>
  <div id="banner"></div>
  <main>
    <section class="view" id="v-inicio"></section>
    <section class="view" id="v-movs" hidden></section>
    <section class="view" id="v-deudas" hidden></section>
    <section class="view" id="v-presupuesto" hidden></section>
    <section class="view" id="v-cuentas" hidden></section>
  </main>
</div>

<button class="fab" id="fab" aria-label="Registrar movimiento"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs" aria-label="Secciones">
  <div class="tabs-in">
    <button class="tab" data-tab="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Inicio</button>
    <button class="tab" data-tab="movs"><svg viewBox="0 0 24 24"><path d="M7 7h13M4 7h.01M7 12h13M4 12h.01M7 17h13M4 17h.01"/></svg>Movimientos</button>
    <button class="tab" data-tab="deudas"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M6 15l4-4 3 3 5-6"/></svg>Deudas</button>
    <button class="tab" data-tab="presupuesto"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 3"/></svg>Presupuesto</button>
    <button class="tab" data-tab="cuentas"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Cuentas</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetBody"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" hidden>

<script src="engine.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
